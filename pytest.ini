[pytest]
# Pytest configuration for event sourcing migration project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    asyncio: Async tests using pytest-asyncio
    integration: Integration tests that require external dependencies (Claude SDK, API keys)
    slow: Slow tests that take >1 second
    performance: Performance tests with specific timing requirements

# Default test options
addopts =
    -v
    --strict-markers
    --tb=short

# Async support
asyncio_default_fixture_loop_scope = function

# Test paths
testpaths = tests

# Ignore patterns
norecursedirs = .git .tox dist build *.egg .venv venv

# Coverage options (if using pytest-cov)
# addopts = --cov=backend --cov-report=html --cov-report=term

# Integration test command examples:
# Run all tests: pytest
# Skip integration tests: pytest -m "not integration"
# Run only integration tests: pytest -m integration
# Run with coverage: pytest --cov=backend --cov-report=html
